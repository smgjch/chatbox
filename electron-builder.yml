productName: Chatbox Lite
appId: io.github.smgjch.chatboxlite
# Match packages/chatbox-i18n/src/languages.ts using Windows/Linux locale filenames.
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
  - ja
  - ko
  - ru
  - de
  - fr
  - pt-PT
  - es
  - ar
  - it
  - sv
  - nb
  - tr
asar: true
asarUnpack:
  - "**/*.{node,dll}"
files:
  - "dist"
  - "!dist/**/*.map"
  - "!dist/**/stats.html"
  - "node_modules"
  - "!node_modules/@types"
  - "!node_modules/undici-types"
  - "package.json"


# releaseInfo:
#   releaseNotes: See the changelog for details

mac:
  # macOS uses .lproj names; electron-builder matches them exactly.
  electronLanguages:
    - en
    - zh_CN
    - zh_TW
    - ja
    - ko
    - ru
    - de
    - fr
    - pt_PT
    - es
    - ar
    - it
    - sv
    - nb
    - tr
  notarize: false
  category: public.app-category.developer-tools
  target:
    target: default
    arch:
      - arm64
      - x64
  type: distribution
  hardenedRuntime: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  verifyUpdateCodeSignature: false
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: assets/installer.nsh

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  app: release/app
  buildResources: assets
  output: release/build

extraResources:
  - ./assets/**

publish: null
